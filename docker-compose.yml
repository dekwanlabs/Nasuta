services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  nasuta:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "${NASUTA_PORT:-8201}:8201"
    environment:
      NASUTA_HTTP_ADDR: "${NASUTA_HTTP_ADDR:-:8201}"
      NASUTA_SQLITE_PATH: "${NASUTA_SQLITE_PATH:-/workspace/.nasuta/index.db}"
      NASUTA_WORKSPACE_ROOT: "${NASUTA_WORKSPACE_ROOT:-/workspace}"
      NASUTA_LOG_FILE: "${NASUTA_LOG_FILE:-/data/logs/all.log}"
      NASUTA_LOG_STDOUT: "${NASUTA_LOG_STDOUT:-true}"
      NASUTA_AUTH_TOKEN: "${NASUTA_AUTH_TOKEN:-}"
      SEMANTIC_PROVIDER: "${SEMANTIC_PROVIDER:-qdrant}"
      SEMANTIC_ENDPOINT: "${SEMANTIC_ENDPOINT:-qdrant:6334}"
      SEMANTIC_COLLECTION: "${SEMANTIC_COLLECTION:-knowledge}"
      SEMANTIC_NAMESPACE: "${SEMANTIC_NAMESPACE:-default}"
      SEMANTIC_API_KEY: "${SEMANTIC_API_KEY:-}"
      SEMANTIC_USERNAME: "${SEMANTIC_USERNAME:-}"
      SEMANTIC_PASSWORD: "${SEMANTIC_PASSWORD:-}"
      SEMANTIC_TLS_ENABLED: "${SEMANTIC_TLS_ENABLED:-false}"
      QDRANT_HOST: "${QDRANT_HOST:-}"
      QDRANT_PORT: "${QDRANT_PORT:-6334}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-knowledge}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-openai}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-1536}"
      EMBEDDING_BATCH: "${EMBEDDING_BATCH:-16}"
      EMBEDDING_CONCURRENCY: "${EMBEDDING_CONCURRENCY:-4}"
      MYSQL_DSN: "${MYSQL_DSN:-}"
      FEISHU_APP_ID: "${FEISHU_APP_ID:-}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET:-}"
      FEISHU_REDIRECT_URI: "${FEISHU_REDIRECT_URI:-}"
      WEB_BASE_URL: "${WEB_BASE_URL:-http://localhost:8201}"
    volumes:
      - sqlite-data:/data
      - "${NASUTA_WORKSPACE_PATH:-./workspace}:${NASUTA_WORKSPACE_ROOT:-/workspace}"

volumes:
  qdrant-data:
  sqlite-data:
